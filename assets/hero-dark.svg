  </g>
  <text x="112" y="58" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="23" font-weight="700" fill="#F2EEE6" letter-spacing="0.4">TryWorld<tspan dx="9" font-size="14" font-weight="500" fill="#9CC7BB">试界</tspan></text>
  <path d="M266 34v28" stroke="#39443F"/>
  <text x="288" y="54" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#A8B0AA">用尝试，打开更多可能。</text>
  <path d="M48 88h1104" stroke="#39443F"/>
  <path d="M672 116v172" stroke="#2A3634"/>
  <text x="48" y="142" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9CC7BB" letter-spacing="2.6">来自宁夏的创作者</text>
  <text x="46" y="216" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="64" font-weight="800" letter-spacing="1"><tspan fill="#F2EEE6">尝试</tspan><tspan fill="#F2693C">，</tspan><tspan fill="#9CC7BB">即世界</tspan><tspan fill="#9CC7BB">。</tspan></text>
  <text x="48" y="256" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="17" fill="#A8B0AA">用 AI、代码和好奇心，把想法做成可以使用的东西。</text>
  <text x="48" y="292" font-family="Georgia,'Times New Roman','Songti SC',serif" font-size="21" font-style="italic" fill="#9CC7BB">Explore by Trying.</text>
  <text x="712" y="142" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#A8B0AA" letter-spacing="2.4">TRY / MAKE / SHARE</text>
  <text x="1152" y="142" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#A8B0AA">试着打开，新的边界。</text>
