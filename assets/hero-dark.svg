  <text x="930" y="272" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#F2EEE6" letter-spacing="1.2">试界 TryWorld</text>
  <text x="930" y="294" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC',sans-serif" font-size="12" fill="#A8B0AA">从一个问题，做到一个产品。</text>
