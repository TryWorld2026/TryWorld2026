<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">试界 TryWorld — 尝试，即世界。</title>
  <desc id="desc">TryWorld brand banner: the connected tw signature, the line “尝试，即世界”, an orbital mark, and Explore by Trying.</desc>
  <rect width="1200" height="320" rx="14" fill="#1B2523"/>
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#33403C"/>
  <g transform="translate(48 34) scale(0.24)" fill="none" stroke="#F2EEE6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
